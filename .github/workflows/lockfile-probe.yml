name: Dependency lockfile probe
on:
  push:
    branches: [security/mitigate-sprintf-js-audit]
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit refreshed lockfile on the test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfile for patched packaging tree"
          git push origin HEAD:security/mitigate-sprintf-js-audit
