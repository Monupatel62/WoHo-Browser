name: Dependency lockfile probe
on:
  push:
    branches: [security/mitigate-sprintf-js-audit]
permissions:
  contents: read
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v7
        with:
          name: electron-builder-26.5.0-lockfile-probe
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
