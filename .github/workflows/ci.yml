name: WoHo Browser CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Lint, typecheck, tests, and build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Inspect dependency advisories
        shell: pwsh
        run: |
          npm audit --json > npm-audit.json
          if ($LASTEXITCODE -ne 0) {
            node -e "const a = require('./npm-audit.json'); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name + ': ' + v.severity + ' fix=' + JSON.stringify(v.fixAvailable) + ' via=' + v.via.map(x => typeof x === 'string' ? x : x.name + ' ' + x.range).join(', '));"
          }
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Enforce full dependency audit (moderate and above)
        run: npm audit --audit-level=moderate
      - name: Generate CycloneDX dependency SBOM
        shell: pwsh
        run: npm sbom --sbom-format=cyclonedx > woho-browser-sbom.cdx.json
      - name: Upload SBOM and dependency audit report
        uses: actions/upload-artifact@v7
        with:
          name: woho-browser-dependency-evidence
          path: |
            woho-browser-sbom.cdx.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Generate third-party license notices
        run: npm run notices
      - name: Test third-party license notice generation
        run: npm run test:notices
      - name: Test release legal preflight gates
        run: npm run test:release-gates
      - name: Test Web companion bookmark validation
        run: npm run test:web
      - name: Build and validate Web companion
        run: npm run build:web
      - name: Upload Web companion artifact
        uses: actions/upload-artifact@v7
        with:
          name: woho-browser-web-companion
          path: dist/web/**
          if-no-files-found: error
          retention-days: 14
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Package unsigned Windows installer
        run: npm run package:win
      - name: Smoke test packaged application startup
        shell: pwsh
        run: .github/scripts/smoke-packaged-app.ps1
      - name: Verify packaged Electron fuses
        shell: pwsh
        run: |
          $app = Get-ChildItem release/win-unpacked -Filter *.exe -File | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $app) { throw 'Could not find the packaged WoHo Browser executable.' }
          $output = npx --yes @electron/fuses read --app $app.FullName 2>&1
          $output | Set-Content -Path release/electron-fuses.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Electron fuses from the packaged executable.' }
          $report = $output -join "`n"
          $checks = @(
            @{ Name = 'RunAsNode'; State = '(false|disabled|off)' },
            @{ Name = 'EnableCookieEncryption'; State = '(true|enabled|on)' },
            @{ Name = 'EnableNodeOptionsEnvironmentVariable'; State = '(false|disabled|off)' },
            @{ Name = 'EnableNodeCliInspectArguments'; State = '(false|disabled|off)' },
            @{ Name = 'EnableEmbeddedAsarIntegrityValidation'; State = '(true|enabled|on)' },
            @{ Name = 'OnlyLoadAppFromAsar'; State = '(true|enabled|on)' },
            @{ Name = 'GrantFileProtocolExtraPrivileges'; State = '(false|disabled|off)' }
          )
          foreach ($check in $checks) {
            if ($report -notmatch ("(?i)" + [regex]::Escape($check.Name) + ".{0,50}" + $check.State)) {
              throw "Expected Electron fuse $($check.Name) to be $($check.State), but the packaged binary did not report that state."
            }
          }
      - name: Generate installer SHA-256 manifest
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -Filter *.exe -File
          if (-not $installers) { throw 'No Windows installer was produced.' }
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows installer and checksum artifact
        uses: actions/upload-artifact@v7
        with:
          name: woho-browser-windows-unsigned
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/electron-fuses.txt
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-LICENSE-INVENTORY.json
          if-no-files-found: error
          retention-days: 14

  android:
    name: Native Android build and tests
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit tests and debug build
        run: gradle -p android --no-build-cache --rerun-tasks clean testDebugUnitTest assembleDebug --stacktrace
      - name: Verify release signing guard is present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Release packaging requires ANDROID_KEYSTORE_PATH' android/app/build.gradle.kts
          grep -Fq 'ANDROID_KEYSTORE_PASSWORD' android/app/build.gradle.kts
          grep -Fq 'ANDROID_KEY_ALIAS' android/app/build.gradle.kts
          grep -Fq 'ANDROID_KEY_PASSWORD' android/app/build.gradle.kts
      - name: Build signed Android release bundle when credentials are configured
        if: ${{ env.ANDROID_SIGNING_CONFIGURED == 'true' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/woho-browser-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          export ANDROID_KEYSTORE_PATH="$keystore_path"
          gradle -p android bundleRelease --no-build-cache --stacktrace
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Explain why Android release bundle was skipped
        if: ${{ env.ANDROID_SIGNING_CONFIGURED != 'true' }}
        shell: bash
        run: |
          echo "::notice::Signed Android release bundle skipped. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
      - name: Upload signed Android release bundle
        if: ${{ env.ANDROID_SIGNING_CONFIGURED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: woho-browser-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: woho-browser-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
