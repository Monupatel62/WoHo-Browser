name: Temporary lockfile bootstrap
on:
  push:
    branches: [chore/bootstrap-npm-lockfile]
permissions:
  contents: write
jobs:
  generate:
    if: "${{ github.event.head_commit.message != 'chore: generated package lockfile' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate package lock without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generated package lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
