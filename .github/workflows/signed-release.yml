name: Signed Draft Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legal-preflight:
    name: Legal and dependency release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set package version from release tag
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH (optional prerelease suffix)."
            exit 1
          fi
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Enforce full dependency audit
        run: npm audit --audit-level=moderate
      - name: Generate third-party license inventory
        run: npm run notices
      - name: Test release legal gate
        run: npm run test:release-gates
      - name: Require legal release approval evidence
        run: npm run verify:release-legal
      - name: Retain legal evidence
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-legal-evidence
          path: |
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-LICENSE-INVENTORY.json
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Sign and verify Windows installer
    needs: legal-preflight
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set package version from release tag
        shell: pwsh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw 'Release tag must be vMAJOR.MINOR.PATCH (optional prerelease suffix).'
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Require Windows signing secrets
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Set WIN_CSC_LINK (base64 PFX) and WIN_CSC_KEY_PASSWORD in repository Actions secrets before creating a release tag.'
          }
      - name: Install locked dependencies and audit
        run: npm ci
      - name: Generate and validate legal evidence
        run: |
          npm run notices
          npm run verify:release-legal
      - name: Build browser application (no signing credentials)
        run: npm run build
      - name: Sign and stage Windows application
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --dir --publish never
      - name: Merge exact packaged Chromium notices
        run: node scripts/merge-electron-chromium-notices.mjs
      - name: Verify staged application and bundled notices
        run: npm run verify:release-legal -- --require-chromium
      - name: Verify packaged Electron fuses
        shell: pwsh
        run: |
          $app = Get-ChildItem release/win-unpacked -Filter *.exe -File | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $app) { throw 'Could not find the packaged WoHo Browser executable.' }
          $output = npx --yes @electron/fuses read --app $app.FullName 2>&1
          $output | Set-Content -Path release/electron-fuses.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Electron fuses from the packaged executable.' }
          $report = $output -join "`n"
          $checks = @(
            @{ Name = 'RunAsNode'; State = '(false|disabled|off)' },
            @{ Name = 'EnableCookieEncryption'; State = '(true|enabled|on)' },
            @{ Name = 'EnableNodeOptionsEnvironmentVariable'; State = '(false|disabled|off)' },
            @{ Name = 'EnableNodeCliInspectArguments'; State = '(false|disabled|off)' },
            @{ Name = 'EnableEmbeddedAsarIntegrityValidation'; State = '(true|enabled|on)' },
            @{ Name = 'OnlyLoadAppFromAsar'; State = '(true|enabled|on)' },
            @{ Name = 'GrantFileProtocolExtraPrivileges'; State = '(false|disabled|off)' }
          )
          foreach ($check in $checks) {
            if ($report -notmatch ("(?i)" + [regex]::Escape($check.Name) + ".{0,50}" + $check.State)) {
              throw "Expected Electron fuse $($check.Name) to be $($check.State), but the packaged binary did not report that state."
            }
          }
      - name: Build signed NSIS installer from verified application image
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --prepackaged release/win-unpacked --publish never
      - name: Verify packaged Windows legal notices
        run: npm run verify:release-legal -- --require-chromium
      - name: Verify Windows Authenticode signatures
        shell: pwsh
        run: |
          $app = Get-ChildItem release/win-unpacked -Filter *.exe -File | Where-Object { $_.Name -notmatch 'uninstaller' } | Select-Object -First 1
          if (-not $app) { throw 'No packaged WoHo Browser executable was found.' }
          $appSignature = Get-AuthenticodeSignature $app.FullName
          if ($appSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Invalid or missing Authenticode signature for app: $($app.Name) — $($appSignature.Status)"
          }
          $installers = Get-ChildItem release -Filter *.exe -File
          if (-not $installers) { throw 'No Windows installer was produced.' }
          $evidence = @("$($app.Name): Status=$($appSignature.Status); Subject=$($appSignature.SignerCertificate.Subject); Thumbprint=$($appSignature.SignerCertificate.Thumbprint)")
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid or missing Authenticode signature: $($installer.Name) — $($signature.Status)"
            }
            $evidence += "$($installer.Name): Status=$($signature.Status); Subject=$($signature.SignerCertificate.Subject); Thumbprint=$($signature.SignerCertificate.Thumbprint)"
          }
          $evidence | Set-Content -Path release/signing-evidence.txt -Encoding utf8
      - name: Generate signed artifact checksums and stage release files
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -Filter *.exe -File
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          New-Item -ItemType Directory -Force release-bundle | Out-Null
          Copy-Item $installers.FullName release-bundle/
          Copy-Item release/SHA256SUMS.txt, release/electron-fuses.txt, release/signing-evidence.txt, THIRD-PARTY-NOTICES.txt, THIRD-PARTY-LICENSE-INVENTORY.json release-bundle/
      - name: Upload signed Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-release
          path: release-bundle/**
          if-no-files-found: error
          retention-days: 90

  android:
    name: Sign and verify Android APK and AAB
    needs: legal-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Set package version from release tag
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH (optional prerelease suffix)."
            exit 1
          fi
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require Android signing secrets and create temporary keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          key_store="$RUNNER_TEMP/woho-browser-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          chmod 600 "$key_store"
          test -s "$key_store"
          echo "ANDROID_KEYSTORE_PATH=$key_store" >> "$GITHUB_ENV"
      - name: Generate notices and require legal approval evidence
        run: |
          npm ci
          npm run notices
          npm run verify:release-legal
          mkdir -p android/app/src/main/assets
          cp THIRD-PARTY-NOTICES.txt android/app/src/main/assets/THIRD-PARTY-NOTICES.txt
          cp THIRD-PARTY-LICENSE-INVENTORY.json android/app/src/main/assets/THIRD-PARTY-LICENSE-INVENTORY.json
      - name: Run Android unit tests without signing credentials
        run: gradle -p android clean testDebugUnitTest
      - name: Build signed Android release APK and AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gradle -p android bundleRelease assembleRelease "-PreleaseVersionName=$version" "-PreleaseVersionCode=$GITHUB_RUN_NUMBER"
      - name: Verify Android release signatures and stage checksums
        shell: bash
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$aab"
          test -s "$apk"
          jarsigner -verify -verbose -certs "$aab" > android-aab-signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > android-apk-signature-verification.txt
          mkdir -p android-release-bundle
          cp "$aab" "$apk" android-release-bundle/
          cp android-aab-signature-verification.txt android-apk-signature-verification.txt android-release-bundle/
          cp THIRD-PARTY-NOTICES.txt android-release-bundle/Android-THIRD-PARTY-NOTICES.txt
          cp THIRD-PARTY-LICENSE-INVENTORY.json android-release-bundle/Android-THIRD-PARTY-LICENSE-INVENTORY.json
          (cd android-release-bundle && sha256sum app-release.aab app-release.apk Android-THIRD-PARTY-NOTICES.txt Android-THIRD-PARTY-LICENSE-INVENTORY.json > ANDROID-SHA256SUMS.txt)
      - name: Upload signed Android release files
        uses: actions/upload-artifact@v7
        with:
          name: signed-android-release
          path: android-release-bundle/**
          if-no-files-found: error
          retention-days: 90

  draft-release:
    name: Assemble draft release for human review
    needs: [legal-preflight, windows, android]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed Windows files
        uses: actions/download-artifact@v7
        with:
          name: signed-windows-release
          path: artifacts/windows
          merge-multiple: true
      - name: Download signed Android files
        uses: actions/download-artifact@v7
        with:
          name: signed-android-release
          path: artifacts/android
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/windows/* artifacts/android/* --draft --verify-tag --title "WoHo Browser $GITHUB_REF_NAME" --notes "DRAFT — verify all signatures, checksums, legal notices, release notes, supported devices, and owner approvals before publishing. The production auto-updater and its anti-downgrade/rollback validation are not implemented; do not advertise automatic updates or treat this draft as production-ready."
