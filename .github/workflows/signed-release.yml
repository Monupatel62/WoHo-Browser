name: Signed Draft Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legal-preflight:
    name: Legal and dependency release gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Enforce full dependency audit
        run: npm audit --audit-level=moderate
      - name: Generate third-party license inventory
        run: npm run notices
      - name: Test release legal gate
        run: npm run test:release-gates
      - name: Require legal release approval evidence
        run: npm run verify:release-legal
      - name: Retain legal evidence
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-legal-evidence
          path: |
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-LICENSE-INVENTORY.json
          if-no-files-found: error
          retention-days: 90

  windows:
    name: Sign and verify Windows installer
    needs: legal-preflight
    runs-on: windows-latest
    env:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require Windows signing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Set WIN_CSC_LINK (base64 PFX) and WIN_CSC_KEY_PASSWORD in repository Actions secrets before creating a release tag.'
          }
      - name: Install locked dependencies and audit
        run: npm ci
      - name: Generate and validate legal evidence
        run: |
          npm run notices
          npm run verify:release-legal
      - name: Package signed Windows installer
        run: npm run package:win
      - name: Verify installer Authenticode signatures
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -Filter *.exe -File
          if (-not $installers) { throw 'No Windows installer was produced.' }
          $evidence = foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid or missing Authenticode signature: $($installer.Name) — $($signature.Status)"
            }
            "$($installer.Name): Status=$($signature.Status); Subject=$($signature.SignerCertificate.Subject); Thumbprint=$($signature.SignerCertificate.Thumbprint)"
          }
          $evidence | Set-Content -Path release/signing-evidence.txt -Encoding utf8
      - name: Generate signed artifact checksums and stage release files
        shell: pwsh
        run: |
          $installers = Get-ChildItem release -Filter *.exe -File
          $lines = foreach ($installer in $installers) {
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          New-Item -ItemType Directory -Force release-bundle | Out-Null
          Copy-Item $installers.FullName release-bundle/
          Copy-Item release/SHA256SUMS.txt, release/electron-fuses.txt, release/signing-evidence.txt, THIRD-PARTY-NOTICES.txt, THIRD-PARTY-LICENSE-INVENTORY.json release-bundle/
      - name: Upload signed Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-release
          path: release-bundle/**
          if-no-files-found: error
          retention-days: 90

  android:
    name: Sign and verify Android APK and AAB
    needs: legal-preflight
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
      - name: Install pinned Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/android-user-home
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Require Android signing secrets and create temporary keystore
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          key_store="$RUNNER_TEMP/woho-browser-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          chmod 600 "$key_store"
          test -s "$key_store"
          echo "ANDROID_KEYSTORE_PATH=$key_store" >> "$GITHUB_ENV"
      - name: Generate notices and require legal approval evidence
        run: |
          npm ci
          npm run notices
          npm run verify:release-legal
          mkdir -p android/app/src/main/assets
          cp THIRD-PARTY-NOTICES.txt android/app/src/main/assets/THIRD-PARTY-NOTICES.txt
          cp THIRD-PARTY-LICENSE-INVENTORY.json android/app/src/main/assets/THIRD-PARTY-LICENSE-INVENTORY.json
      - name: Build signed Android release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH (optional prerelease suffix)."
            exit 1
          fi
          gradle -p android clean testDebugUnitTest bundleRelease assembleRelease             "-PreleaseVersionName=$version" "-PreleaseVersionCode=$GITHUB_RUN_NUMBER"
      - name: Verify Android release signatures and stage checksums
        shell: bash
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$aab"
          test -s "$apk"
          jarsigner -verify -verbose -certs "$aab" > android-aab-signature-verification.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > android-apk-signature-verification.txt
          mkdir -p android-release-bundle
          cp "$aab" "$apk" android-release-bundle/
          cp android-aab-signature-verification.txt android-apk-signature-verification.txt android-release-bundle/
          cp THIRD-PARTY-NOTICES.txt THIRD-PARTY-LICENSE-INVENTORY.json android-release-bundle/
          (cd android-release-bundle && sha256sum app-release.aab app-release.apk THIRD-PARTY-NOTICES.txt THIRD-PARTY-LICENSE-INVENTORY.json > SHA256SUMS.txt)
      - name: Upload signed Android release files
        uses: actions/upload-artifact@v7
        with:
          name: signed-android-release
          path: android-release-bundle/**
          if-no-files-found: error
          retention-days: 90

  draft-release:
    name: Assemble draft release for human review
    needs: [legal-preflight, windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download signed Windows files
        uses: actions/download-artifact@v7
        with:
          name: signed-windows-release
          path: artifacts/windows
          merge-multiple: true
      - name: Download signed Android files
        uses: actions/download-artifact@v7
        with:
          name: signed-android-release
          path: artifacts/android
          merge-multiple: true
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/windows/* artifacts/android/*             --draft --verify-tag --title "WoHo Browser $GITHUB_REF_NAME"             --notes "DRAFT — verify all signatures, checksums, legal notices, release notes, supported devices, and owner approvals before publishing. The production auto-updater and its anti-downgrade/rollback validation are not implemented; do not advertise automatic updates or treat this draft as production-ready."
